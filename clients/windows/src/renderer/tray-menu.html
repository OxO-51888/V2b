<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XiaoV2B 托盘菜单</title>
  <style>
    :root {
      --surface: #fffefd;
      --line: #efd8e2;
      --muted: #8c7a86;
      --ink: #2a2025;
      --pink: #ff5f9f;
      --pink-soft: #ffd9ea;
      --yellow: #FFEA6C;
      --blue: #b8e8ff;
      --green: #b9f3cf;
      --orange: #ffb47a;
      --purple: #cbb7ff;
      font-family: Inter, "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 260px;
      height: 336px;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: transparent;
    }

    .menu {
      display: grid;
      gap: 12px;
      width: 100%;
      height: 100%;
      margin: 0;
      border: 1px solid rgba(239, 216, 226, .92);
      border-radius: 22px;
      padding: 14px;
      background: rgba(255, 240, 250, .98);
      box-shadow: 0 18px 50px rgba(198, 94, 139, .22);
    }

    .label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .status {
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--pink);
      background: #ffe2f2;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      border-radius: 14px;
      padding: 6px;
      background: #ffe2f2;
    }

    button {
      height: 38px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .mode.active {
      border: 3px solid transparent;
      color: var(--pink);
      background:
        linear-gradient(var(--pink-soft), var(--pink-soft)) padding-box,
        conic-gradient(from var(--connect-angle), var(--blue), var(--green), var(--yellow), var(--orange), var(--pink), var(--purple), var(--blue)) border-box;
      animation: connected-marquee 1.35s linear infinite;
    }

    .actions {
      display: grid;
      gap: 8px;
    }

    .connect {
      position: relative;
      overflow: hidden;
      color: #2a2025;
      background: var(--yellow);
    }

    .connect.running {
      color: var(--pink);
      border: 3px solid transparent;
      background:
        linear-gradient(#ffc2de, #ffc2de) padding-box,
        conic-gradient(from var(--connect-angle), var(--blue), var(--green), var(--yellow), var(--orange), var(--pink), var(--purple), var(--blue)) border-box;
      animation: connected-marquee 1.35s linear infinite;
    }

    .connect.loading {
      color: var(--pink);
      background:
        linear-gradient(#ffc2de, #ffc2de) left / var(--connect-progress, 52%) 100% no-repeat,
        var(--yellow);
      transition: background-size .34s cubic-bezier(.2, .78, .22, 1);
    }

    .connect.loading:disabled {
      opacity: 1;
    }

    .open {
      height: 48px;
      border-radius: 13px;
      color: #fff;
      background: var(--pink);
      font-size: 17px;
    }

    .rate-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .rate-card {
      display: grid;
      gap: 5px;
      min-width: 0;
      border-radius: 13px;
      padding: 9px 10px;
      background: #ffe2f2;
    }

    .rate-card strong,
    .rate-card span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rate-card strong {
      font-size: 15px;
      font-weight: 900;
    }

    .rate-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .exit {
      color: var(--pink);
      border: 1px solid var(--pink);
      background: transparent;
    }

    @property --connect-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    @keyframes connected-marquee {
      to {
        --connect-angle: 360deg;
      }
    }

  </style>
</head>
<body>
  <main class="menu">
    <button id="openBtn" class="open" type="button">打开客户端</button>

    <div class="label">
      <span>代理模式</span>
      <span id="status" class="status">未连接</span>
    </div>

    <section class="modes">
      <button class="mode" data-mode="rule" type="button">规则</button>
      <button class="mode" data-mode="global" type="button">全局</button>
      <button class="mode" data-mode="auto" type="button">自动</button>
    </section>

    <section class="actions">
      <button id="connectBtn" class="connect" type="button">一键连接</button>
      <div class="rate-row">
        <div class="rate-card">
          <strong id="uploadRate">0 B/s</strong>
          <span>上传速率</span>
        </div>
        <div class="rate-card">
          <strong id="downloadRate">0 B/s</strong>
          <span>下载速率</span>
        </div>
      </div>
      <button id="closeWindowBtn" class="exit" type="button">关闭客户端</button>
    </section>
  </main>

  <script>
    const modes = Array.from(document.querySelectorAll('.mode'));
    const statusEl = document.querySelector('#status');
    const connectBtn = document.querySelector('#connectBtn');
    const uploadRateEl = document.querySelector('#uploadRate');
    const downloadRateEl = document.querySelector('#downloadRate');
    let currentState = { mode: 'rule', running: false, connecting: false };
    let lastTraffic = null;

    function rateText(bytesPerSecond) {
      const value = Math.max(0, Number(bytesPerSecond || 0));
      if (value >= 1000 * 1000) return `${(value / 1000 / 1000).toFixed(value >= 10 * 1000 * 1000 ? 0 : 1)} MB/s`;
      if (value >= 1000) return `${(value / 1000).toFixed(value >= 10 * 1000 ? 0 : 1)} KB/s`;
      return `${Math.round(value)} B/s`;
    }

    function resetRates() {
      lastTraffic = null;
      uploadRateEl.textContent = '0 B/s';
      downloadRateEl.textContent = '0 B/s';
    }

    async function pollTraffic() {
      if (!window.trayMenu.getTraffic) return;
      try {
        const snapshot = await window.trayMenu.getTraffic();
        const now = Date.now();
        const uploadTotal = Number(snapshot.uploadTotal || 0);
        const downloadTotal = Number(snapshot.downloadTotal || 0);
        const source = String(snapshot.source || '');
        let uploadRate = 0;
        let downloadRate = 0;
        const hasRealtimeRate = Number.isFinite(Number(snapshot.uploadRate)) || Number.isFinite(Number(snapshot.downloadRate));
        if (hasRealtimeRate) {
          uploadRate = Math.max(0, Number(snapshot.uploadRate || 0));
          downloadRate = Math.max(0, Number(snapshot.downloadRate || 0));
        } else if (lastTraffic && lastTraffic.source === source) {
          const elapsed = Math.max((now - lastTraffic.at) / 1000, 0.5);
          uploadRate = Math.max(0, uploadTotal - lastTraffic.uploadTotal) / elapsed;
          downloadRate = Math.max(0, downloadTotal - lastTraffic.downloadTotal) / elapsed;
        }
        uploadRateEl.textContent = rateText(uploadRate);
        downloadRateEl.textContent = rateText(downloadRate);
        lastTraffic = { uploadTotal, downloadTotal, source, at: now };
      } catch {
        resetRates();
      }
    }

    function render(state) {
      currentState = { ...currentState, ...(state || {}) };
      const mode = currentState.mode || 'rule';
      modes.forEach((button) => button.classList.toggle('active', button.dataset.mode === mode));
      statusEl.textContent = currentState.connecting ? '连接中' : (currentState.running ? '已连接' : '未连接');
      connectBtn.disabled = Boolean(currentState.connecting);
      connectBtn.classList.toggle('running', Boolean(currentState.running));
      connectBtn.classList.toggle('loading', Boolean(currentState.connecting));
      connectBtn.style.setProperty('--connect-progress', currentState.connecting ? '58%' : (currentState.running ? '100%' : '0%'));
      connectBtn.textContent = currentState.connecting ? '正在连接' : (currentState.running ? '断开连接' : '一键连接');
    }

    modes.forEach((button) => {
      button.addEventListener('click', async () => {
        const mode = button.dataset.mode;
        render({ mode });
        resetRates();
        const result = await window.trayMenu.setMode(mode);
        render({ mode, running: Boolean(result.running) });
      });
    });

    connectBtn.addEventListener('click', async () => {
      if (currentState.connecting) return;
      render({ connecting: true });
      resetRates();
      const result = currentState.running ? await window.trayMenu.disconnect() : await window.trayMenu.connect();
      render({ connecting: false, running: Boolean(result.running), mode: result.mode || currentState.mode });
    });

    document.querySelector('#openBtn').addEventListener('click', () => window.trayMenu.open());
    document.querySelector('#closeWindowBtn').addEventListener('click', () => window.trayMenu.exit());
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') window.trayMenu.hide();
    });

    window.trayMenu.onState(render);
    window.trayMenu.getState().then(render);
    pollTraffic();
    setInterval(pollTraffic, 1000);
  </script>
</body>
</html>
