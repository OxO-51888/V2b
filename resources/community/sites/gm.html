<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="same-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>售后群聊</title>
  <link rel="stylesheet" href="chat.css?v=a5aee2126e03">
  <link rel="stylesheet" href="chat-nini.css?v=cf83556939ef">
  <script src="lucide.min.js" defer></script>
  <script src="chat.js?v=2d92d6ff7a78" defer></script>
  <script src="/theme/NINI/assets/vendor/marked.umd.js?v=15.0.12" defer></script>
  <script src="resources.js?v=e8ae6cc8ff70" defer></script>
</head>
<body>
<main class="community-layout">
<section class="chat-app" aria-label="群聊对话">
  <header class="chat-header">
    <a class="icon-button" href="/#/dashboard" target="_top" title="返回面板" aria-label="返回面板"><i data-lucide="arrow-left"></i></a>
    <div class="heading"><h1>售后群聊</h1><span id="status" role="status">正在连接</span></div>
    <span id="identity"></span>
    <button id="refresh" class="icon-button" title="刷新" aria-label="刷新"><i data-lucide="refresh-cw"></i></button>
  </header>
  <div id="error" class="error" role="alert" hidden></div>
  <div id="messages" class="messages" role="log" aria-label="群聊消息" aria-live="polite" aria-relevant="additions">
    <button id="older" class="older" hidden>查看更早消息</button>
    <div id="empty" class="empty">暂无消息</div>
    <div id="list"></div>
  </div>
  <button id="unread" class="unread" hidden></button>
  <section class="composer" aria-label="发送消息">
    <div id="reply" class="reply" hidden><span id="reply-text"></span><button id="cancel-reply" class="icon-button" title="取消回复" aria-label="取消回复"><i data-lucide="x"></i></button></div>
    <div id="attachments" class="attachments"></div>
    <textarea id="message" aria-label="消息" aria-describedby="compose-hint" placeholder="输入消息，也可以粘贴图片" maxlength="2000" rows="3" disabled></textarea>
    <div class="compose-tools">
      <button id="attach" class="icon-button" title="添加图片" aria-label="添加图片" disabled><i data-lucide="image-plus"></i></button>
      <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
      <span id="count">0 / 2000</span>
      <button id="send" class="send" disabled><i data-lucide="send"></i><span>发送</span></button>
    </div>
    <p id="compose-hint">回车发送 · Shift + 回车换行 · 可粘贴图片</p>
  </section>
</section>
<aside class="community-resources" aria-label="公告与专属客户端下载">
  <section class="resource-card publish-card" aria-labelledby="publish-heading">
    <header class="resource-heading"><span class="resource-heading-icon"><i data-lucide="compass"></i></span><div><h2 id="publish-heading">发布页</h2></div></header>
    <div class="publish-content">
      <p>此网站永远不变，请保存为书签。</p>
      <a class="publish-link" href="https://xn--54qr1i.xn--oor32f63hs9js55d.com/" target="_blank" rel="noopener noreferrer"><span>打开网址发布页</span><i data-lucide="arrow-up-right"></i></a>
    </div>
  </section>
  <section class="resource-card announcement-card" aria-labelledby="notice-heading">
    <header class="resource-heading"><span class="resource-heading-icon"><i data-lucide="megaphone"></i></span><div><h2 id="notice-heading">站点公告</h2><p>服务动态，及时了解</p></div><button id="notice-reload" class="icon-button" title="刷新公告" aria-label="刷新公告"><i data-lucide="refresh-cw"></i></button></header>
    <div id="notice-list" class="resource-list" aria-live="polite"><p class="resource-empty">正在加载公告…</p></div>
    <nav class="notice-pagination" aria-label="公告翻页"><button id="notice-prev" disabled aria-label="上一页公告"><i data-lucide="chevron-left"></i></button><span id="notice-page">最新公告</span><button id="notice-next" disabled aria-label="下一页公告"><i data-lucide="chevron-right"></i></button></nav>
  </section>
  <section class="resource-card download-card" aria-labelledby="download-heading">
    <header class="resource-heading"><span class="resource-heading-icon"><i data-lucide="download"></i></span><div><h2 id="download-heading">专属客户端下载</h2><p>本站专用客户端</p></div></header>
    <div id="client-list" class="client-list" data-windows-download-url="https://xz.5188000.xyz/khd/%E5%85%89%E5%96%B5%20%E5%AE%89%E8%A3%85%201.0.0.exe" data-windows-version="1.0.0" aria-live="polite"><p class="resource-empty">正在加载客户端…</p></div>
  </section>
</aside>
</main>
<dialog id="viewer" aria-labelledby="viewer-title"><header class="viewer-toolbar"><strong id="viewer-title">图片预览</strong><button id="close-viewer" class="icon-button viewer-close" title="关闭图片" aria-label="关闭图片"><i data-lucide="x"></i><span>关闭图片</span></button></header><div class="viewer-stage"><img id="full-image" alt="群聊图片"></div></dialog>
</body>
</html>
