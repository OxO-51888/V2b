<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客户端授权管理</title>
  <style nonce="__CSP_NONCE__">
    :root {
      --pink: #ff4f9a;
      --pink-soft: #fff0f7;
      --pink-border: #ffd0e5;
      --ink: #241820;
      --muted: #8b7582;
      --line: #f2d8e6;
      --card: rgba(255, 255, 255, 0.92);
      --bad: #e6425e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 8%, #ffe5f2 0, transparent 32%),
        radial-gradient(circle at 88% 12%, #fff3c8 0, transparent 26%),
        linear-gradient(135deg, #fff9fc, #fff2f8 52%, #fff8ef);
      color: var(--ink);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 90px;
      padding: 0 28px;
      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }
    h1 { margin: 0; font-size: 34px; line-height: 1; }
    .login {
      max-width: 520px;
      margin: 70px auto;
      padding: 26px;
      border: 1px solid var(--pink-border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 24px 80px rgba(255, 79, 154, 0.14);
    }
    .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input, button {
      height: 42px;
      border: 1px solid var(--pink-border);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    input { padding: 0 12px; }
    input:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255, 79, 154, 0.12);
    }
    button {
      padding: 0 18px;
      cursor: pointer;
      border-color: transparent;
      background: var(--pink);
      color: #fff;
      font-weight: 700;
      user-select: none;
      box-shadow: 0 8px 18px rgba(255, 79, 154, 0.16);
      transition:
        transform 120ms ease,
        box-shadow 120ms ease,
        background-color 120ms ease;
    }
    button:not(:disabled):hover {
      background: #ff3f92;
      box-shadow: 0 10px 24px rgba(255, 79, 154, 0.22);
    }
    button:not(:disabled):active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 4px 10px rgba(255, 79, 154, 0.16);
    }
    button:disabled { opacity: .55; cursor: default; box-shadow: none; }
    .message {
      min-height: 22px;
      color: var(--bad);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <h1>客户端授权管理</h1>
  </header>

  <div class="login" id="loginBox">
    <h2>管理员验证</h2>
    <div class="bar">
      <input id="tokenInput" type="password" placeholder="管理密钥 AUTH_ADMIN_TOKEN" style="flex:1; min-width:260px">
      <button id="loginBtn">进入</button>
    </div>
    <p class="message" id="loginMsg"></p>
  </div>

  <script nonce="__CSP_NONCE__">
    const tokenKey = 'xv2bAdminToken';
    const dashboardPath = '__ADMIN_PATH__/dashboard';
    const tokenInput = document.getElementById('tokenInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginMsg = document.getElementById('loginMsg');

    if (sessionStorage.getItem(tokenKey)) {
      location.replace(dashboardPath);
    }

    async function verifyToken(token) {
      const response = await fetch('/api/admin/panels', {
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        }
      });
      const text = await response.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text }; }
      if (!response.ok || data.ok === false) throw new Error(data.message || `请求失败：${response.status}`);
    }

    async function login() {
      const token = tokenInput.value.trim();
      loginMsg.textContent = '';
      if (!token) {
        loginMsg.textContent = '请输入管理密钥';
        return;
      }
      try {
        loginBtn.disabled = true;
        loginBtn.textContent = '验证中';
        await verifyToken(token);
        sessionStorage.setItem(tokenKey, token);
        location.replace(dashboardPath);
      } catch (error) {
        loginMsg.textContent = error.message || '验证失败';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '进入';
      }
    }

    loginBtn.addEventListener('click', login);
    tokenInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') login();
    });
  </script>
</body>
</html>
